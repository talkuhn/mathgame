<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one calm white card at a time on a pale grass-tinted ground; one green action, gold for success, soft red for a miss */
:root {
  --bg: #f1f5ef;
  --card: #ffffff;
  --ink: #17261f;
  --muted: #5d7066;
  --line: #dde5de;
  --green: #1e7a4f;
  --green-soft: #e2f0e7;
  --gold: #f6c928;
  --gold-soft: #fff3bf;
  --amber: #a85d00;
  --amber-soft: #ffe8c7;
  --font-display: 'Secular One', 'Arial Hebrew', sans-serif;
  --font-body: 'Heebo', 'Arial Hebrew', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  margin: 0;
  padding-inline: 16px;
  padding-block: 20px 40px;
  min-height: 100%;
}
/* Stadium photo behind everything; fixed so it stays put while the cards scroll */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg) url("bg.jpg") center / cover no-repeat; }
.app { max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.6rem; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.88); border-radius: 18px; padding: 8px 14px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.score-chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); background: rgba(255,255,255,.88); border-radius: 14px 14px 0 0; padding-inline: 6px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tab { flex: 1; font: inherit; font-weight: 600; padding: 10px 4px; border: none; background: none; color: var(--muted); cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; }
.tab[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }

.panel { display: flex; flex-direction: column; gap: 16px; }
.card-box { background: var(--card); border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 2px 12px rgba(23,38,31,.06); }
.title { text-align: center; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { font-family: var(--font-display); font-size: 1.4rem; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

.btn { font-family: var(--font-display); font-size: 1.35rem; padding: 15px 20px; border-radius: 16px; border: none; background: var(--green); color: #fff; cursor: pointer; width: 100%; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--green-soft); color: var(--green); }

/* Game */
.meter { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 10px; background: var(--green-soft); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width .3s; }
.count { color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; }
.q { text-align: center; font-family: var(--font-display); font-size: clamp(3.4rem, 18vw, 5rem); direction: ltr; unicode-bidi: isolate; line-height: 1.1; font-variant-numeric: tabular-nums; padding-block: 6px; }
.q .x { color: var(--green); }
.q .retry { display: block; font-family: var(--font-body); font-size: .9rem; color: var(--muted); font-weight: 600; direction: rtl; margin-top: 4px; }

.typed { font-family: var(--font-display); font-size: 2.6rem; min-height: 76px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: var(--bg); direction: ltr; font-variant-numeric: tabular-nums; }
.typed.empty { color: #7f9387; }
.typed.right { background: var(--gold-soft); }
.typed.wrong { background: var(--amber-soft); color: var(--amber); }
.typed.show { background: var(--green-soft); color: var(--green); }
.typed-wrap { display: flex; flex-direction: column; gap: 12px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; direction: ltr; }
.key { font-family: var(--font-display); font-size: 1.7rem; min-height: 58px; border-radius: 16px; border: none; background: var(--bg); color: var(--ink); cursor: pointer; }
.key:active { background: var(--green-soft); }
.key:disabled { opacity: .4; cursor: default; }
.key.go { background: var(--green); color: #fff; }

.feedback { min-height: 1.6em; text-align: center; font-weight: 800; font-size: 1.2rem; color: var(--green); }
.feedback.bad { color: var(--amber); }
.feedback.info { color: var(--muted); }

.shake { animation: shake .35s; }
.pop { animation: pop .35s; }
@keyframes shake { 25% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

.stars { font-size: 2.4rem; letter-spacing: .15em; color: var(--gold); text-align: center; }

/* Album */
.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; position: relative; background: var(--green-soft); max-width: 100%; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.locked img { filter: grayscale(1) brightness(1.5) opacity(.25); }
.card .lock { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 2rem; color: var(--green); }
.card.got { cursor: zoom-in; box-shadow: 0 0 0 3px var(--gold); }
.card .num { position: absolute; top: 6px; inset-inline-start: 6px; background: var(--card); color: var(--ink); font-family: var(--font-display); border-radius: 8px; padding: 0 7px; font-size: .9rem; z-index: 1; }

.overlay { position: fixed; inset: 0; background: rgba(23,38,31,.6); display: grid; place-items: center; padding: 20px; z-index: 10; }
.reveal { background: var(--card); border-radius: 22px; padding: 22px; width: min(340px, 100%); display: flex; flex-direction: column; gap: 16px; text-align: center; }
.reveal .card { width: 70%; margin-inline: auto; }
@media (prefers-reduced-motion: reduce) { .shake, .pop { animation: none; } .fill { transition: none; } }

.zoom { position: fixed; inset: 0; background: rgba(23,38,31,.82); display: grid; place-items: center; z-index: 60; padding: 16px; cursor: zoom-out; }
.zoom img { max-width: min(92vw, 440px); max-height: 86vh; border-radius: 18px; box-shadow: 0 0 0 4px var(--gold), 0 12px 40px rgba(0,0,0,.45); animation: zin .18s ease-out; }
.zoom button { position: absolute; top: 14px; inset-inline-start: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); font-size: 1.4rem; cursor: pointer; }
@keyframes zin { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* Touch: no double-tap zoom, no text selection on controls, no grey tap flash */
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.key, .chip, .tab, .btn { -webkit-user-select: none; user-select: none; }

/* Tablet (iPad portrait and up): wider column, larger type and touch targets */
@media (min-width: 700px) {
  body { font-size: 19px; padding-inline: 28px; padding-block: 28px 56px; }
  .app { max-width: 640px; gap: 22px; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.9rem; }
  .top { padding: 10px 20px; border-radius: 22px; }
  .score-chip { padding: 8px 18px; font-size: 1.15rem; }
  .tabs { border-radius: 18px 18px 0 0; padding-inline: 10px; }
  .tab { padding: 14px 6px; font-size: 1.1rem; }
  .card-box { padding: 32px 30px; border-radius: 28px; gap: 24px; }
  .chips { gap: 14px; }
  .chip { width: 72px; height: 72px; font-size: 1.8rem; }
  .btn { font-size: 1.6rem; padding: 20px 24px; border-radius: 20px; }
  .bar { height: 12px; }
  .q { font-size: 6rem; padding-block: 12px; }
  .typed { font-size: 3.2rem; min-height: 96px; border-radius: 20px; }
  .keypad { gap: 14px; }
  .key { font-size: 2.1rem; min-height: 76px; border-radius: 20px; }
  .feedback { font-size: 1.4rem; }
  .album { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card .num { font-size: 1.05rem; }
  .reveal { width: min(440px, 100%); padding: 30px; }
  .zoom img { max-width: min(92vw, 560px); }
  .zoom button { width: 54px; height: 54px; }
  .stars { font-size: 3.2rem; }
}

/* iPad landscape: question on one side, answer input on the other; photo framed on the ball */
@media (min-width: 900px) and (orientation: landscape) {
  body { padding-block: 20px 36px; }
  body::before { background-position: center 72%; }
  .app { max-width: 920px; gap: 18px; }
  #game { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; row-gap: 12px; align-items: center; padding: 26px 34px; }
  #game .meter { grid-column: 1 / -1; }
  #game .q { grid-column: 1; grid-row: 2; font-size: 7.5rem; }
  #game .feedback { grid-column: 1; grid-row: 3; align-self: start; }
  #game .typed-wrap { grid-column: 2; grid-row: 2 / span 2; }
  .key { min-height: 68px; }
  .album { grid-template-columns: repeat(6, 1fr); }
  #setup, #end { max-width: 640px; width: 100%; margin-inline: auto; }
}
</style>
</head>
<body>
<div class="app" dir="rtl" lang="he">
  <div class="top">
    <h1>כפל בכדורגל</h1>
    <div class="score-chip" id="scoreChip" aria-live="polite">⚽ 0</div>
  </div>

  <div class="tabs" role="tablist" aria-label="תפריט">
    <button class="tab" role="tab" id="tab-play" aria-selected="true" aria-controls="p-play">משחק</button>
    <button class="tab" role="tab" id="tab-album" aria-selected="false" aria-controls="p-album">האלבום</button>
  </div>

  <!-- PLAY -->
  <section class="panel" id="p-play" role="tabpanel">
    <div class="card-box" id="setup">
      <h2 class="title">באיזה לוחות נתאמן היום?</h2>
      <div class="chips" id="tableChips" role="group" aria-label="בחירת לוחות כפל"></div>
      <button class="btn" id="startBtn">בואו נתחיל</button>
    </div>

    <div class="card-box" id="game" hidden>
      <div class="meter">
        <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
        <div class="count" id="roundInfo"></div>
      </div>
      <div class="q" id="question"></div>

      <div class="typed-wrap" id="typedWrap">
        <div class="typed empty" id="typed" aria-live="polite">?</div>
        <div class="keypad" id="keypad"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>

    <div class="card-box" id="end" hidden>
      <h2 class="title">כל הכבוד!</h2>
      <div class="stars" role="img" aria-label="שלושה כוכבים">★★★</div>
      <button class="btn" id="againBtn">עוד סיבוב</button>
      <button class="btn ghost" id="backBtn">לבחור לוחות אחרים</button>
    </div>
  </section>

  <!-- ALBUM -->
  <section class="panel" id="p-album" role="tabpanel" hidden>
    <div class="card-box">
      <h2 class="title" id="albumCount"></h2>
      <div class="album" id="album"></div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle">
    <h2 id="revealTitle">גוווול! כרטיס חדש</h2>
    <div class="card got pop" id="revealCard"></div>
    <button class="btn" id="revealBtn">ממשיכים</button>
  </div>
</div>

<div class="zoom" id="zoom" hidden role="dialog" aria-label="תצוגה מוגדלת"><button type="button" id="zoomClose" aria-label="סגירה">✕</button><img id="zoomImg" alt=""></div>
<script>
(function () {
  document.documentElement.dir = 'rtl';
  document.documentElement.lang = 'he';
  var $ = function (id) { return document.getElementById(id); };
  var TOTAL_CARDS = 60, ROUND = 10, PER_CARD = 7, MAX_DUE_PER_ROUND = 4;

  // SRS-BEGIN spaced repetition for facts the child missed (spacing is counted in answered questions, not in days)
  // level 1..5 -> number of answered questions to wait before the fact is due again
  var INTERVALS = [0, 6, 15, 35, 70, 130];
  function srsMigrate(st) {
    if (!st.facts || typeof st.facts !== 'object') st.facts = {};
    if (typeof st.answered !== 'number') st.answered = st.correct || 0;
    if (st.weak) {
      Object.keys(st.weak).forEach(function (k) {
        if (st.weak[k] > 0 && !st.facts[k]) st.facts[k] = { level: 1, dueAt: st.answered };
      });
      delete st.weak;
    }
    return st;
  }
  // a miss on the first try (re)starts tracking at level 1; +1 because the current question is not counted yet
  function srsMiss(st, k) {
    st.facts[k] = { level: 1, dueAt: st.answered + 1 + INTERVALS[1] };
  }
  // first-try success; call after st.answered was incremented. Only a due fact moves up; level 5 graduates it
  function srsSuccess(st, k) {
    var f = st.facts[k];
    if (!f || f.dueAt > st.answered) return;
    if (f.level >= 5) { delete st.facts[k]; return; }
    f.level++;
    f.dueAt = st.answered + INTERVALS[f.level];
  }
  // up to maxDue due facts (most overdue first), then untracked facts, then tracked facts that are not due yet
  function srsPick(st, pool, shuf, size, maxDue) {
    function kk(p) { return p[0] + 'x' + p[1]; }
    var out = pool.filter(function (p) { var f = st.facts[kk(p)]; return f && f.dueAt <= st.answered; })
      .sort(function (x, y) { return st.facts[kk(x)].dueAt - st.facts[kk(y)].dueAt; })
      .slice(0, maxDue);
    var rest = pool.filter(function (p) { return out.indexOf(p) < 0; });
    var fresh = rest.filter(function (p) { return !st.facts[kk(p)]; });
    var waiting = rest.filter(function (p) { return !!st.facts[kk(p)]; });
    var order = shuf(fresh.slice()).concat(shuf(waiting.slice()));
    while (out.length < size) {
      if (!order.length) order = shuf(pool.slice());
      out.push(order.shift());
    }
    return out;
  }
  // SRS-END

  // saved state (per-viewer convenience only)
  var state = { unlocked: [], correct: 0, answered: 0, facts: {} };
  try {
    var s = JSON.parse(localStorage.getItem('kefel-kaduregel') || 'null');
    if (s && Array.isArray(s.unlocked)) {
      state = s;
      state.unlocked = state.unlocked.filter(function (i, p, a) { return i >= 0 && i < TOTAL_CARDS && a.indexOf(i) === p; });
      state.correct = +state.correct || 0;
      state.answered = +state.answered || state.correct;
    }
  } catch (e) {}
  srsMigrate(state);
  function save() { try { localStorage.setItem('kefel-kaduregel', JSON.stringify(state)); } catch (e) {} }

  // sound (generated in the browser, starts after the first tap)
  var actx = null;
  function ac() {
    try {
      if (!actx) { var C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
    return actx;
  }
  function tone(f, at, dur, type, vol) {
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var SFX = {
    tick: function () { tone(900, 0, 0.04, 'sine', 0.06); },
    good: function () { tone(659, 0, 0.12, 'triangle', 0.2); tone(880, 0.1, 0.22, 'triangle', 0.2); },
    miss: function () { tone(262, 0, 0.14, 'sine', 0.16); tone(220, 0.13, 0.26, 'sine', 0.16); },
    reveal: function () { tone(330, 0, 0.28, 'sine', 0.12); },
    card: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.1, 0.22, 'triangle', 0.2); }); tone(1319, 0.42, 0.5, 'triangle', 0.18); },
    win: function () { [523, 659, 784].forEach(function (f, i) { tone(f, i * 0.12, 0.2, 'triangle', 0.2); }); tone(1047, 0.36, 0.5, 'triangle', 0.2); }
  };
  function sfx(n) { try { SFX[n](); } catch (e) {} }

  // tabs
  var tabs = ['play', 'album'];
  function showTab(name) {
    tabs.forEach(function (t) {
      $('tab-' + t).setAttribute('aria-selected', String(t === name));
      $('p-' + t).hidden = t !== name;
    });
    if (name === 'album') renderAlbum();
  }
  tabs.forEach(function (t) { $('tab-' + t).addEventListener('click', function () { showTab(t); }); });
  function updateChip() { $('scoreChip').textContent = '⚽ ' + state.unlocked.length + '/' + TOTAL_CARDS; }

  var CHEERS = ['✓ כל הכבוד!', '✓ מעולה!', '✓ גוווול!', '✓ בול!', '✓ יפה מאוד!'];
  var MISSES = ['אוי, כמעט! נסו שוב', 'לא נורא, יש עוד ניסיון', 'קרוב! חשבו ונסו שוב', 'עוד רגע וזה שם, נסו שוב'];

  // setup controls
  var selected = [];
  var chipsEl = $('tableChips');
  function syncStart() { $('startBtn').disabled = selected.length === 0; $('startBtn').style.opacity = selected.length ? '' : '.5'; }
  syncStart();
  for (var n = 2; n <= 10; n++) (function (n) {
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = n; b.id = 'chip' + n; b.setAttribute('aria-label', 'לוח ' + n);
    b.setAttribute('aria-pressed', String(selected.indexOf(n) > -1));
    b.addEventListener('click', function () {
      var i = selected.indexOf(n);
      if (i > -1) selected.splice(i, 1); else selected.push(n);
      b.setAttribute('aria-pressed', String(selected.indexOf(n) > -1));
      syncStart();
    });
    chipsEl.appendChild(b);
  })(n);

  // keypad
  var typedVal = '';
  var padEl = $('keypad');
  ['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(function (k) {
    var b = document.createElement('button');
    b.className = 'key' + (k === '✓' ? ' go' : ''); b.textContent = k;
    b.setAttribute('aria-label', k === '⌫' ? 'מחיקה' : k === '✓' ? 'בדיקה' : k);
    b.addEventListener('click', function (e) { if (e.detail) b.blur(); pressKey(k); });
    padEl.appendChild(b);
  });
  function renderTyped() {
    var t = $('typed');
    t.textContent = typedVal || '?';
    t.classList.toggle('empty', !typedVal);
  }
  function pressKey(k) {
    if (locked) return;
    if (k === '⌫') typedVal = typedVal.slice(0, -1);
    else if (k === '✓') { if (typedVal) submit(parseInt(typedVal, 10)); return; }
    else if (typedVal.length < 3) { typedVal += k; sfx('tick'); }
    renderTyped();
  }
  document.addEventListener('keydown', function (e) {
    if ($('game').hidden || !$('overlay').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('⌫');
    else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') pressKey('✓');
  });

  // game
  var qs = [], idx = 0, locked = false, attempt = 1;
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function key(a, b) { return a + 'x' + b; }

  function buildQuestions() {
    var pool = [];
    selected.forEach(function (a) { for (var b = 1; b <= 10; b++) pool.push([a, b]); });
    var out = srsPick(state, pool, shuffle, ROUND, MAX_DUE_PER_ROUND);
    return shuffle(out).map(function (p) { return { a: p[0], b: p[1], retry: false }; });
  }
  function startRound() {
    if (!selected.length) return;
    qs = buildQuestions(); idx = 0;
    $('setup').hidden = true; $('end').hidden = true; $('game').hidden = false;
    showQ();
  }
  function setKeys(off) { Array.prototype.forEach.call(padEl.children, function (b) { b.disabled = off; }); }
  function showQ() {
    locked = false; typedVal = ''; attempt = 1;
    var q = qs[idx];
    $('question').innerHTML = q.a + ' <span class="x">×</span> ' + q.b + (q.retry ? '<span class="retry">תרגיל לחזרה</span>' : '');
    $('roundInfo').textContent = (idx + 1) + '/' + qs.length;
    $('fill').style.width = (idx / qs.length * 100) + '%';
    var f = $('feedback'); f.textContent = ''; f.className = 'feedback';
    var t = $('typed'); t.className = 'typed empty'; renderTyped();
    setKeys(false);
  }
  function submit(v) {
    if (locked) return; locked = true;
    var q = qs[idx], c = q.a * q.b, k = key(q.a, q.b);
    var typed = $('typed'), fb = $('feedback');

    if (v === c) {
      setKeys(true);
      typed.className = 'typed right pop'; typed.textContent = v;
      fb.className = 'feedback';
      var earned = false; sfx('good');
      state.answered++;
      if (attempt === 1) {
        fb.textContent = CHEERS[rnd(0, CHEERS.length - 1)];
        if (!q.retry) srsSuccess(state, k);
      } else {
        fb.textContent = '✓ הצלחתם בניסיון השני';
      }
      state.correct++;
      earned = state.correct % PER_CARD === 0 && state.unlocked.length < TOTAL_CARDS;
      save();
      setTimeout(function () { if (earned) unlockCard(next); else next(); }, earned ? 500 : 900);
      return;
    }

    if (attempt === 1) {
      // first miss: remember it, queue it for later, give a second chance now
      srsMiss(state, k); save();
      if (!q.retry) qs.splice(Math.min(idx + 3, qs.length), 0, { a: q.a, b: q.b, retry: true });
      attempt = 2; sfx('miss');
      typed.className = 'typed wrong shake'; typed.textContent = v;
      fb.textContent = MISSES[rnd(0, MISSES.length - 1)]; fb.className = 'feedback bad';
      setTimeout(function () {
        typedVal = ''; typed.className = 'typed empty'; renderTyped();
        fb.textContent = '';
        setKeys(false);
        locked = false;
      }, 900);
      return;
    }

    // second miss: just show the right answer and move on
    state.answered++; save();
    setKeys(true);
    typed.className = 'typed show'; typed.textContent = c; sfx('reveal');
    fb.textContent = 'התשובה היא ' + c + '. עוד נתרגל אותו'; fb.className = 'feedback info';
    setTimeout(next, 2200);
  }
  function next() {
    idx++;
    if (idx >= qs.length) return endRound();
    showQ();
  }
  function endRound() {
    $('game').hidden = true; $('end').hidden = false;
    sfx('win');
  }
  $('startBtn').addEventListener('click', startRound);
  $('againBtn').addEventListener('click', startRound);
  $('backBtn').addEventListener('click', function () { $('end').hidden = true; $('setup').hidden = false; });

  // cards
  function cardHTML(i, got) {
    if (!got) return '<div class="num">' + (i + 1) + '</div><div class="lock" role="img" aria-label="כרטיס נעול">?</div>';
    return '<div class="num">' + (i + 1) + '</div><img src="img/p' + (i + 1) + '.jpg" alt="כרטיס שחקן ' + (i + 1) + '">';
  }
  function unlockCard(done) {
    var left = [];
    for (var i = 0; i < TOTAL_CARDS; i++) if (state.unlocked.indexOf(i) < 0) left.push(i);
    if (!left.length) return done();
    var pick = left[rnd(0, left.length - 1)];
    state.unlocked.push(pick); save(); updateChip();
    $('revealCard').innerHTML = cardHTML(pick, true);
    $('overlay').hidden = false; sfx('card');
    $('revealBtn').focus();
    $('revealBtn').onclick = function () { $('overlay').hidden = true; done(); };
  }
  function renderAlbum() {
    var h = '';
    for (var i = 0; i < TOTAL_CARDS; i++) {
      var got = state.unlocked.indexOf(i) > -1;
      h += '<div class="card ' + (got ? 'got' : 'locked') + '">' + cardHTML(i, got) + '</div>';
    }
    $('album').innerHTML = h;
    $('albumCount').textContent = 'נאספו ' + state.unlocked.length + ' מתוך ' + TOTAL_CARDS;
  }

  function closeZoom() { $('zoom').hidden = true; }
  $('album').addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('.card.got') : null;
    if (!c) return;
    var im = c.querySelector('img'); if (!im) return;
    $('zoomImg').src = im.src; $('zoom').hidden = false;
  });
  $('zoom').addEventListener('click', closeZoom);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeZoom(); });

  updateChip();
})();
</script>
</body>
</html>
